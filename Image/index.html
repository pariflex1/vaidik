<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Contact Manager</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
margin:0;
padding:10px;
}

h2{
text-align:center;
}

#search{
width:100%;
padding:10px;
border-radius:8px;
border:1px solid #ccc;
margin-bottom:10px;
font-size:16px;
}

.card{
background:white;
padding:10px;
margin-bottom:8px;
border-radius:10px;
display:flex;
align-items:center;
justify-content:space-between;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.info{
flex:1;
margin-left:10px;
}

.phone{
font-size:17px;
font-weight:bold;
}

.name{
font-size:13px;
color:#555;
}

#deleteBtn{
position:fixed;
bottom:15px;
left:10px;
right:10px;
background:#e53935;
color:white;
border:none;
padding:14px;
font-size:18px;
border-radius:10px;
}

</style>

</head>

<body>

<h2>Contact Delete</h2>

<input id="search" placeholder="Search number..." onkeyup="searchContacts()">

<div id="list">Loading...</div>

<button id="deleteBtn" onclick="deleteSelected()">
Delete Selected
</button>

<script>

const API="https://script.google.com/macros/s/AKfycbx9lqq1Spyo6wrDJQXsirwbwNTqSjI9H0-_9p6iD980ZetfbfToabqCJgTwjTVGn9TQ/exec";

let contacts=[];

async function loadContacts(){

const res=await fetch(API);
contacts=await res.json();

renderContacts(contacts);

}



function renderContacts(data){

const list=document.getElementById("list");
list.innerHTML="";

data.forEach(c=>{

const div=document.createElement("div");

div.className="card";

div.innerHTML=`

<input type="checkbox" value="${c.phone}" class="chk">

<div class="info">
<div class="name">${c.name}</div>
<div class="phone">${c.phone}</div>
</div>

`;

list.appendChild(div);

});

}



function searchContacts(){

const q=document.getElementById("search").value.toLowerCase();

const filtered=contacts.filter(c=>

c.phone.toString().includes(q) ||
(c.name && c.name.toLowerCase().includes(q))

);

renderContacts(filtered);

}



async function deleteSelected(){

const checked=[...document.querySelectorAll(".chk:checked")]
.map(x=>x.value);

if(checked.length==0){

alert("Select contacts");
return;

}

if(!confirm("Delete "+checked.length+" contacts?")) return;

for(let phone of checked){

await fetch(API+"?phone="+phone,{
method:"POST"
});

}

loadContacts();

}

loadContacts();

</script>

</body>
</html>
