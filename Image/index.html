<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Contact Delete</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
padding:10px;
margin:0;
}

h2{
text-align:center;
margin:10px 0 20px 0;
}

#search{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
}

.card{
background:white;
padding:12px;
margin-bottom:10px;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
display:flex;
justify-content:space-between;
align-items:center;
}

.info{
display:flex;
flex-direction:column;
}

.name{
font-size:14px;
color:#555;
}

.phone{
font-size:18px;
font-weight:bold;
}

button{
background:#e53935;
border:none;
color:white;
padding:8px 14px;
border-radius:6px;
font-size:14px;
}

button:active{
transform:scale(.95);
}

.loading{
text-align:center;
padding:20px;
color:#777;
}

</style>

</head>

<body>

<h2>Delete Contacts</h2>

<input id="search" placeholder="Search number..." onkeyup="searchContacts()">

<div id="list" class="loading">Loading contacts...</div>

<script>

const API="https://script.google.com/macros/s/AKfycbx9lqq1Spyo6wrDJQXsirwbwNTqSjI9H0-_9p6iD980ZetfbfToabqCJgTwjTVGn9TQ/exec";

let contacts=[];

async function loadContacts(){

document.getElementById("list").innerHTML="Loading...";

const res=await fetch(API);
contacts=await res.json();

renderContacts(contacts);

}



function renderContacts(data){

const list=document.getElementById("list");
list.innerHTML="";

if(data.length==0){

list.innerHTML="<div class='loading'>No contacts</div>";
return;

}

data.forEach(c=>{

const div=document.createElement("div");

div.className="card";

div.innerHTML=`

<div class="info">
<div class="name">${c.name}</div>
<div class="phone">${c.phone}</div>
</div>

<button onclick="deleteContact('${c.phone}')">
Delete
</button>

`;

list.appendChild(div);

});

}



function searchContacts(){

const q=document.getElementById("search").value;

const filtered=contacts.filter(c=>

c.phone.toString().includes(q) ||
(c.name && c.name.toLowerCase().includes(q.toLowerCase()))

);

renderContacts(filtered);

}



async function deleteContact(phone){

if(!confirm("Delete "+phone+" ?")) return;

await fetch(API+"?phone="+phone,{
method:"POST"
});

loadContacts();

}

loadContacts();

</script>

</body>
</html>
